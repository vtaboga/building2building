# @package _global_
# CHS-based PPO hyperparameter tuning (Patterson et al., RLC 2024).
#
# One run per (building_type, task) pair.  Orion TPE explores PPO
# hyperparameters while evaluating across 8 buildings (one per climate
# zone).  SLURM job array workers call suggest/observe in a loop.
#
# Sweep (run as SLURM job array):
#   python -m baselines.tune_ppo experiment=tune_ppo \
#       building_type=OfficeSmall task=task1
#
# CHS analysis (after all sweep jobs complete):
#   python -m baselines.tune_ppo experiment=tune_ppo \
#       building_type=OfficeSmall task=task1 analyze=true
#
# Re-evaluation:
#   python -m baselines.tune_ppo experiment=tune_ppo \
#       building_type=OfficeSmall task=task1 reeval=true

name: tune_ppo

defaults:
  - override /policy: ppo
  - override /training: default

building_type: ???            # e.g. OfficeSmall, OfficeMedium, ...
task: ???                     # e.g. task1, task2, task3, task4

# Orion / CHS parameters
n_trials: 100
n_startup_trials: 20
ntune_seeds: 3                # seeds per (building, trial) in the sweep
algorithm: tpe

# Paths (use SCRATCH for shared DB on Mila cluster)
orion_db_dir: ${oc.env:SCRATCH,outputs}/orion_dbs
results_dir: ${oc.env:SCRATCH,outputs}/chs_results/${building_type}_${task}

# Modes
reeval: false
analyze: false
reeval_seeds: 30
reeval_timesteps: 5_000_000

# Override training budget for the sweep (shorter than full training)
training:
  total_timesteps: 4_000_000
  n_envs: 8
