# @package _global_
# PPO sweep across all six normalized tasks.
#
# Trains per-building PPO specialists for all six
# normalized tasks across 3 seeds and the full-year run period.  Uses the
# existing PPO hyperparameters.  Results feed the
# task-study analysis alongside the reactive baseline returns.
name: train_ppo_task_study

defaults:
  - override /policy: ppo
  - override /training: default

building_types:
  - OfficeSmall
  - OfficeMedium
  - RetailStandalone
  - RestaurantFastFood
  - Warehouse
  - SingleFamilyHouse

split: test
buildings_per_type: 8
tasks: [task_const_e0, task_const_e05, task_occ_e0, task_occ_e05, task_rand_e0, task_rand_e05]
seeds: [0, 1, 2]

training:
  total_timesteps: 5_000_000
  n_envs: 14
