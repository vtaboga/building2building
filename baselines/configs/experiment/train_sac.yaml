# @package _global_
# Train per-building SAC specialists (companion to train_ppo.yaml).
name: train_sac

defaults:
  - override /policy: sac
  - override /training: sac

building_types:
  - OfficeSmall
  - OfficeMedium
  - RetailStandalone
  - RestaurantFastFood
  - Warehouse
  - SingleFamilyHouse

split: test
buildings_per_type: 8
building_ids: null
# Normalized-reward presets (NormalizedDeadbandReward with per-bucket τ_T/τ_E
# from reward_normalizers.yaml).  energy_weight=0 (w0 suffix)
# focuses the policy purely on thermal comfort; switch to wmed/whigh to add an
# energy penalty.  The three modes cover constant, occupancy, and random-schedule
# temperature targets — equivalent coverage to the legacy task1/task3/task5.
tasks: [task_const_w0, task_occ_w0, task_rand_w0]

training:
  total_timesteps: 2_000_000
  n_envs: 4
