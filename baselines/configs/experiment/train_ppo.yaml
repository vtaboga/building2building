# @package _global_
# Train per-building PPO specialists
name: train_ppo

defaults:
  - override /policy: ppo
  - override /training: default

building_types:
  - OfficeSmall
  - OfficeMedium
  - RetailStandalone
  - RestaurantFastFood
  - Warehouse
  - SingleFamilyHouse

split: test
buildings_per_type: 8
building_ids: null
run_period: full_year  # one of full_year / winter / summer
# Optional alternate reward-normalizer YAML (null = packaged default).
normalizer_path: null
tasks: [task_const_e0, task_const_e05, task_occ_e0, task_occ_e05, task_rand_e0, task_rand_e05]

training:
  total_timesteps: 5_000_000
  n_envs: 14
