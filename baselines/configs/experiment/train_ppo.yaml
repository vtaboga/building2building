# @package _global_
# Train per-building PPO specialists (Section 5, Appendix E.2)
name: train_ppo

defaults:
  - override /policy: ppo
  - override /training: default

building_types:
  - OfficeSmall
  - OfficeMedium
  - RetailStandalone
  - RestaurantFastFood
  - Warehouse
  - SingleFamilyHouse

split: test
buildings_per_type: 8
tasks: [task1, task2, task3, task4, task5]

training:
  total_timesteps: 5_000_000
  n_envs: 14
