# SAC starting point for B2B HVAC control.
#
# Target setting: `task_occ_wmed` — the normalized-deadband occupancy
# task with `w_E=1.0` (the calibration anchor; medium importance to
# energy).  Reward is
#   r = -( temp_penalty / τ_T  +  w_E · power_penalty / τ_E )
# where (τ_T, τ_E) come from `building2building/data/reward_normalizers.yaml`
# and are calibrated so that at `w_E=1` on full-year tuned-RBC the two
# per-step contributions both sit near 1.0 (so per-step reward ≈ -2).
# Setpoint mode is `occupancy` with seasonal unoccupied policy
# (winter 18°C / shoulder 21°C / summer 26°C unoccupied; 21°C occupied).
# `dT=1°C` deadband.
#
# Episode size: full_year @ 12 ts/h ≈ 105k steps; winter ≈ 9k steps;
# summer ≈ 9k steps.  Action space: bounded Box of heating setpoints
# (cooling pinned at 40°C); the cardinality is 1–6 setpoints depending
# on the building.
#
# Reward magnitudes (empirically verified on the existing PPO checkpoints
# at $SCRATCH/b2b_reward_design_normalized/data/):
#   - per-step  : roughly [-2, -17] on winter; ≈ -2 on full_year at the
#                 calibration anchor (both contributions ≈ 1).
#   - per-episode (full_year) : ≈ -2 × 1e5 = -2e5.
# Critically, the normalization forces the reward into an O(1)-per-step
# regime by construction — *this matters a lot for SAC* because the
# entropy temperature α and reward magnitude live on the same axis.
# This is the strongest single argument for using the normalized reward
# family with SAC: scale tuning is no longer a per-building exercise.
#
# Literature anchors (cited in inline comments below):
#   - rl-baselines3-zoo `pybullet-defaults` block (HalfCheetah/Ant/
#     Hopper/Walker2d-Bullet, all long-horizon bounded-action continuous
#     control): lr=7.3e-4, buffer=300k, batch=256, gamma=0.98, tau=0.02,
#     train_freq=8, gradient_steps=8, use_sde=True, log_std_init=-3,
#     net_arch=[400, 300].
#   - Kathirgamanathan et al. 2021 (arxiv 2104.12125) — SAC on Large-
#     Office EnergyPlus, cooling-setpoint control: lr=1e-3, tau=3e-3,
#     buffer=2e6, batch=2048, update_interval=96 steps (= once per day
#     at 1h cadence), hidden=[64, 64].  Found constant α=0.05 better
#     than α=0.2; γ=0.99 Pareto-optimal alongside γ=0.9.  Critical
#     finding for our 5-min cadence: "increasing the time between
#     successive control actions from 15 minutes to 1 hour was necessary"
#     for SAC to learn (table 3 + section 4.1).
#   - Sinergym (arxiv 2412.08293): defaults to SB3 SAC with [256, 256]
#     MLP and lr=3e-4; finds PPO most stable, SAC second.
#   - Raffin & Stulp 2020 — generalized State-Dependent Exploration
#     (gSDE): better-suited than i.i.d. Gaussian for smooth-dynamics
#     bounded-action control; default in rl-zoo Bullet block.
#   - Nikishin et al. 2022 — primacy bias under high UTD ratios; we
#     deliberately keep UTD = 1 (train_freq == gradient_steps).

algorithm: sac
policy_type: MlpPolicy
device: auto

# ── Optimisation ──────────────────────────────────────────────────────
# 7.3e-4 is the rl-zoo pybullet/long-horizon bullet default; SB3's
# 3e-4 is Mujoco-tuned and conservative for our setting.  Kathirga-
# manathan used 1e-3 (with batch 2048), which is also defensible.
# 7.3e-4 is the middle of the empirically-tested band.
learning_rate: 7.3e-4

# Replay buffer size.
#
# This is the most setting-dependent parameter in the YAML, so
# document the reasoning carefully:
#
#   - On `--run-period full_year` (the calibration regime, recommended
#     for SAC studies): 1 episode ≈ 105k steps.  300k = ~2.85 episodes
#     of context, which is enough to keep early-spring transitions in
#     memory while training continues into late-spring/summer/fall.
#     This is the seasonal non-stationarity argument from
#     arxiv 2509.15032.
#   - On `--run-period winter` (or summer): 1 episode ≈ 9k steps.
#     300k = ~33 episodes of context — plenty.
#   - RAM cost: 300k × (obs_dim ≈ 80 + action_dim ≈ 5 + 3 scalars) ×
#     4 bytes per float ≈ 100 MB.  Comfortable on a 32 GB SLURM node.
#   - rl-zoo Bullet block uses 300k for the same reason (long-horizon,
#     bounded action, smooth dynamics).
#   - Kathirgamanathan's 2e6 is overkill at our episode size and was
#     paired with an 8k-step episode regime.
#
# If we ever switch to multi-year training to handle inter-annual
# weather variation, raise this to 1e6.
buffer_size: 1_000_000

# Warmup before any gradient update.  10k = ~1.4 days at 5-min cadence.
# The buffer needs enough diverse transitions before the policy starts
# learning, otherwise the first gradient lock the policy into a bad
# local minimum (the PPO failure mode we are deliberately avoiding).
# rl-zoo Bullet uses 10k.
learning_starts: 15_000

# Batch size.  At gradient_steps=4 and train_freq=4, each "training
# block" sees ~2k samples — enough diversity to average out the per-step
# EnergyPlus noise without exhausting the buffer's effective sample
# size.  Kathirgamanathan used 2048 with episodic 1-day updates; that
# is the right end of the spectrum, ours is the middle.
batch_size: 512

# Target network smoothing.  0.005 is SB3 default (paired with
# gradient_steps=1); 0.02 is rl-zoo Bullet default (paired with
# gradient_steps>1).  Faster target tracking compensates for the more
# frequent critic updates we run (gradient_steps=4 below).
tau: 0.02

# Discount factor.  γ=0.99 → effective horizon ≈ 100 steps × 5 min
# ≈ 8 h at 12 ts/h.  This spans a full daytime "load-shifting" window
# (morning pre-heat through evening occupancy) while staying conservative
# on value-function variance.
#
# Three independent building-RL studies converge on γ ≥ 0.97 for
# thermal-mass tasks: Kathirgamanathan 2021 (γ=0.99 Pareto-optimal),
# the MDPI 2025 physics-informed HVAC RL survey, and the chiller-control
# DQN study (S1359431125031709).  γ=0.995 doubles the horizon to ~16 h
# (overnight pre-conditioning) but also doubles value-function target
# variance — worth trying as a follow-up sweep, not as a default.
gamma: 0.99

# Update cadence and gradient density.
#
# train_freq=4, gradient_steps=4 → UTD ratio of 1 but spread coarser.
# This gives the policy time to actually move the building between
# updates, which matters because consecutive 5-min EnergyPlus timesteps
# are nearly identical (the thermal mass is too slow to react in 5 min).
# Per-step updates would mostly see redundant transitions.
#
# rl-zoo Bullet uses (8, 8) for ~60Hz continuous control; our 5-min
# cadence is already much coarser than that, so (4, 4) is the right
# scaling.  Kathirgamanathan's choice of "1 update per day"
# (train_freq=96) is the other extreme — they had to do that because
# their 15-min cadence was too noisy for SAC to learn from.  Our
# normalized reward is much smoother, so we can afford to update more
# often.  Avoids the high-UTD primacy-bias regime documented in
# Nikishin et al. 2022.
train_freq: 4
gradient_steps: 4

# Auto entropy temperature.  This is *the* reason we picked SAC over
# PPO: α adapts to maintain a target entropy, which prevents the
# action-bound saturation that froze PPO at high w_E.  At w_E=1
# (this config's anchor), α should stay in a reasonable range
# throughout training.
#
# Reward-scale check (load-bearing for SAC):
#   At the calibration anchor `w_E=1`, per-step reward magnitude is
#   ~|r| = 1–3 and target entropy ≈ -action_dim ≈ -5.  The entropy
#   bonus per step is α × (-5).  For α ∈ [0.01, 0.5] (the typical
#   converged range), the entropy bonus is dominated by the reward
#   for small α and competes with the reward for α ≈ 0.5.  This is
#   the regime SAC's auto-tuning is designed for.
#
# If you ever switch to a different `w_E` level (e.g. `task_occ_w50`
# or `task_occ_w100`), the per-step reward grows roughly linearly
# with `w_E`, which can starve the entropy-bonus term.  In that case,
# either pin `ent_coef` to a fixed value (e.g. 0.1) or use a more
# negative `target_entropy` (e.g. `-2 × action_dim`).
ent_coef: auto

target_update_interval: 1

# `auto` resolves to `-action_dim`.  For multi-zone buildings (e.g.
# OfficeMedium has ~5 heating setpoints), target_entropy ≈ -5;
# OfficeSmall has ~1 zone, so target_entropy ≈ -1.  The single-zone
# regime is the riskiest for entropy collapse — monitor `train/ent_coef`
# in W&B and pin manually if it drops below 1e-3.
target_entropy: auto

# gSDE: state-dependent exploration.  Critical for HVAC because it
# means similar (state, time-of-day) tuples produce smoothly-correlated
# exploration noise rather than i.i.d. jitter.  For a thermal-mass
# system, that translates to "the agent explores by holding a
# slightly-different setpoint for an afternoon" instead of "the agent
# explores by twitching the setpoint every 5 min", and the latter is
# essentially a wash on building dynamics.
#
# Also a direct mitigation for the action-bound saturation that killed
# PPO: noise is injected in the pre-squash latent space rather than
# clipped at the action boundary, so even when the policy mean is at
# the bound the gradient still has signal.
#
# `sde_sample_freq=64` ≈ 5 h at 5-min cadence — exploration stays
# correlated across an entire afternoon.  Standard rl-zoo choice.
use_sde: true
sde_sample_freq: 64

# ── Network architecture ──────────────────────────────────────────────
# [400, 300] is the rl-zoo Bullet default and is empirically the
# best-tested size for long-horizon bounded-action control.  Larger
# than Sinergym's [256, 256] and much larger than Kathirgamanathan's
# [64, 64], but those were paired with much smaller batch sizes;
# at batch=512 the [400, 300] net trains stably.
#
# log_std_init=-3 → initial σ ≈ 0.05 in pre-Tanh latent space.  After
# the SquashedGaussian, initial actions are within ~3% of the policy
# mean, so we are not uniformly random at step 0 — gSDE provides the
# meaningful exploration during warmup.  α (auto) then expands the
# policy std as needed during learning.
policy_kwargs:
  net_arch:
    pi: [400, 300]
    qf: [400, 300]
  activation_fn: ReLU
  log_std_init: -3.0
