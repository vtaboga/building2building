# Read the Docs configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml

# mkdocstrings imports the package to render the API reference, so the
# package (with docs extras) must be installed in the build env.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
