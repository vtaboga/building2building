# @package _global_
name: collect_dataset
track: false

defaults:
  - environment: vt_small_office
  - policies: constant
  - _self_

seed: 1

# Dataset collection configuration
dataset:
  num_episodes: 1
  policy_type: "constant"  # Options: "constant", "dqn", "ppo"
  model_path: null  # Path to trained model (required for DQN/PPO)

hydra:
  run:
    dir: results/collect_dataset_${building_id}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: results/collect_dataset_${now:%Y-%m-%d_%H-%M-%S}
    subdir: building_${building_id}
