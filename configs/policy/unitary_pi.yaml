type: unitary_pi

# Control objective
target_temp_c: 19.0
deadband_c: 2.0

# Optional time-based target schedule (no hardcoded setpoints in code).
# EnergyPlus day_of_week convention: 1=Sunday, ..., 7=Saturday
target_schedule:
  enabled: true
  weekend_days: [1, 7]
  weekend_target_c: 21.0
  weekday_target_c: 21.0
  weekday_setback_target_c: 18.0
  weekday_setback_start_hour: 9.0
  weekday_setback_end_hour: 16.0

# Force HVAC system available while commanding airflow + setpoints.
# EnergyPlus availability override values:
# 1=ForceOff, 2=CycleOn, 3=CycleOnZoneFansOnly
availability_on: 2.0

# Unitary PI baseline actuates:
# - fan air mass flow rate (PI)
# - a single outlet-node temperature setpoint (fixed per mode)
outlet_temp_heating_c: 40.0
outlet_temp_cooling_c: 12.0

# PI control on fan mass flow rate [kg/s]
# Command form: fan = fan_base_kg_s + kp*(target - tz) + ki*∫(target - tz)
fan_base_kg_s: 1.0
kp: 0.5
ki: 0.001
integral_limit: 1000.0

# Optional clamps (null means "use action_space bounds")
fan_min_kg_s: null
fan_max_kg_s: null

