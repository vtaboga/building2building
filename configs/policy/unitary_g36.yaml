type: unitary_g36

# ASHRAE G36 §5.18 — single-zone VAV piecewise-linear controller.
# Two PI loops (heating / cooling) produce [0, 1] demand signals.
# Fan speed and SAT are mapped directly from those signals.

# Zone setpoints [°C] — aligned with reward deadband [20, 22]°C.
heating_setpoint_c: 20.0
cooling_setpoint_c: 22.0

# PI gains — tuned for 15-min timesteps.
# kp=2.0 means 0.5 °C error → full demand; reaches max heating/cooling faster
# for small persistent errors.  ki=0.1 accelerates integral wind-up.
kp: 2.0
ki: 0.1

# Fan speed fractions (of design-max from action space).
# min_fan_fraction must stay above ~58% to ensure the heating coil can
# overcome outdoor-air dilution at design heating conditions.  At lower
# fan speeds the fixed minimum ventilation volume becomes a larger
# fraction of total airflow, chilling the mixed air and starving
# heat delivery.
min_fan_fraction: 0.70
med_fan_fraction: 0.85

# SAT bounds [°C]
# sat_min_c: minimum cooling SAT
# sat_max_c: null → read from action space (building-specific)
sat_min_c: 13.0
sat_max_c: null

availability_on: 2.0

target_schedule:
  enabled: false
