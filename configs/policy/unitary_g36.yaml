type: unitary_g36

# G36-inspired PI airflow + Trim-and-Respond SAT controller for PSZ.
# Zone temperature PI loop modulates fan airflow; T&R adjusts SAT.

# Zone setpoints [C] -- inset 0.25 C from reward deadband [20, 22] C
# to give the controller margin before hitting the penalty boundary.
heating_setpoint_c: 20.25
cooling_setpoint_c: 21.75

# PI gains for zone-temp -> airflow loop.
kp: 0.25
ki: 0.02
integral_max: 200.0

# Minimum fan speed (fraction of design-max from action space).
min_fan_fraction: 0.15

# SAT Trim-and-Respond parameters [C].
sat_min_c: 12.0
sat_max_c: 35.0
sat_initial_c: 21.0
sat_trim: 0.5
sat_respond: 1.0
demand_deadband: 0.5

availability_on: 2.0

target_schedule:
  enabled: false
