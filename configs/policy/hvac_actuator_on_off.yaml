target_temp_c: 21.0
deadband_c: 0.5

# Heuristic actuator levels (tune per building/system)
fan_mass_flow_kg_s: 1.0
terminal_mass_flow_kg_s: 1.0
# Coil speed values: integer part selects speed level, fractional part is speed ratio.
# Avoid exact integers (e.g., 1.0 -> ratio 0.0) which can effectively turn the coil off.
coil_speed_heat: 1.5
coil_speed_cool: 1.5
supplemental_stage_heat: 0.0

# Optional: if the building exposes `Unitary HVAC :: Sensible Load Request [W]` in the EDD,
# these values force heating/cooling demand directly (bypassing thermostat setpoints).
# Set to 0 to disable.
q_heat_w: 6000.0
q_cool_w: 6000.0

# AirLoopHVAC availability override:
# 0=NoAction, 1=ForceOff, 2=CycleOn, 3=CycleOnZoneFansOnly
availability_on: 2.0
availability_off: 1.0


