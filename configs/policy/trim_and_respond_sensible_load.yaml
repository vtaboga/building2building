#
# Trim-and-Respond controller for the "Unitary HVAC :: Sensible Load Request" actuator [W].
#
# Sign convention:
# - positive = heating request
# - negative = cooling request
#

type: trim_and_respond
target_temp_c: 21.0
deadband_c: 0.5

# Step sizes (W)
respond_step_w: 1000.0
trim_step_w: 500.0

# Output saturation (W)
q_heat_max_w: 20000.0
q_cool_max_w: 20000.0


