#
# Trim-and-Respond controller for the "Unitary HVAC :: Sensible Load Request" actuator.
#
# Sign convention:
# - positive = heating request
# - negative = cooling request
#

type: trim_and_respond
target_temp_c: 21.0
deadband_c: 0.5

# Step sizes as fraction of inferred actuator bounds (preferred).
respond_step_pct: 0.05
trim_step_pct: 0.02

# Output saturation as fraction of inferred actuator bounds (preferred).
q_heat_max_pct: 1.0
q_cool_max_pct: 1.0

# Back-compat (deprecated): absolute watts. If provided, converted to pct using inferred bounds.
# respond_step_w: 1000.0
# trim_step_w: 500.0
# q_heat_max_w: 20000.0
# q_cool_max_w: 20000.0


