# Configuration for parameterized multi-building training
# This config trains a single policy that generalizes across buildings

defaults:
  - _self_
  - wandb: default
  - training: default
  - policy: ppo
  - reward: deadband
  - rollout: default

# Environment configuration
env:
  normalize_obs: true
  # Enable building parameter augmentation (area, warmup_phases, num_actuators)
  augment_building_params: true
  max_steps: 672  # One week at 15-min timesteps

# Building selection criteria
# These will be used to sample buildings for training
bldg:
  geometry_unit_type: "single-family detached"
  geometry_building_num_units: 1
  # Don't fix year_built - sample from different years for diversity
  # year_built: null

# Number of episodes for testing
n_episodes: 1

# Random seed for reproducibility
seed: 42

# Hydra output directory configuration
hydra:
  run:
    dir: outputs/parameterized/${policy.algorithm}/${now:%d-%m-%Y}/${now:%H-%M-%S}

