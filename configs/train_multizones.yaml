defaults:
  - _self_
  - wandb: default
  - training: default
  - policy: ppo
  - reward: deadband
  - task: default

multizones:
  building_type: OfficeSmall   # Warehouse, HotelSmall, RetailStandalone, RestaurantFastFood, OfficeMedium, OfficeSmall
  split: train                 # train or test
  index: 0                     # 0-based position in the split's ID list

env:
  normalize_obs: true
  normalize_action: true
  max_steps: 35040             # full year at 15-min timesteps

seed: 42

hydra:
  run:
    dir: outputs/train_multizones/${multizones.building_type}/${multizones.split}_${multizones.index}/${policy.algorithm}/${now:%Y%m%d_%H%M%S}
  job:
    chdir: true
