defaults:
  - _self_
  - benchmark_interface: single_type

benchmark_interface:
  mode: single_type
  building_type: OfficeSmall
  train:
    selection:
      mode: random
      n: 2
      seed: 42
      replace: false
      indices: []
      queries: []
    config:
      reward:
        reward_type: BarrierRewardConfig
        energy_weight: 0.1
        deadband_c: 0.5
        violation_penalty: 100.0
      task:
        run_period: winter
        target_temperature_mode: occupancy
        default_zone_target_temperature:
          occupied_c: 21.0
          unoccupied_c: 18.0
        zone_target_temperatures: {}
  test:
    selection:
      mode: random
      n: 2
      seed: 7
      replace: false
      indices: []
      queries: []
    config:
      reward:
        reward_type: DeadbandRewardConfig
        energy_weight: 0.05
        target_temp: 21.0
        dT: 0.5
      task:
        run_period: summer
        target_temperature_mode: constant
        default_zone_target_temperature:
          occupied_c: 22.0
          unoccupied_c: 22.0
        zone_target_temperatures: {}

output:
  resolve_configs: false
  summary_file: benchmark_multizones_splits_summary.json

hydra:
  run:
    dir: outputs/benchmarks/multizones_splits/${benchmark_interface.mode}/${now:%Y%m%d}/${now:%H%M%S}
  job:
    chdir: true
