# @package _global_
# Multirun experiment for multiple buildings
defaults:
  - override /hydra/launcher: basic

hydra:
  mode: MULTIRUN
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: building_${building_id}

# Building IDs to run
building_id: 1003000512784,1003000523385,1003000528568,1003000530527 