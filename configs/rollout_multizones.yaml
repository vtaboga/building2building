defaults:
  - _self_
  - policy: zone_temp_21
  - reward: deadband
  - task: default

multizones:
  # Building types to evaluate.
  # null = all 6 types; or a list like [OfficeSmall, Warehouse]
  types: null
  # Number of buildings per type (first N by building_id).
  n_per_type: 5

env:
  max_steps: null

hydra:
  run:
    dir: outputs/rollout_multizones/${policy.type}/${now:%Y%m%d}/${now:%H%M%S}
  job:
    chdir: true
