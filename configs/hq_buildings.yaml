defaults:
  - _self_

processing:

  # Output path relative to the Hydra run directory (or absolute path).
  output: hq_processing_results.json

  # Dataset slicing (0-based indices).
  start: 0
  stop: null
  limit: 5

  # Write a checkpoint every N processed buildings.
  checkpoint_every: 100

  # IMPORTANT: default is frozen for backward compatibility.
  controls: [unitary_hvac, baseboard, fanonoff]

  # Optional override; must be under $SCRATCH and not under $HOME.
  store_path: null

  # If true, validate config + write an empty JSON (no downloads/sims).
  dry_run: false

hydra:
  run:
    dir: outputs/processing/hq_buildings/${now:%Y%m%d}/${now:%H%M%S}
  job:
    chdir: true

