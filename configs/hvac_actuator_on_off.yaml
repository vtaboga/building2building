defaults:
  - base
  - _self_
  - bldg: single_family
  - override /policy: hvac_actuator_on_off

env:
  normalize_obs: false
  hvac_action_space: box
  n_bins_continuous: 21
  max_steps: 30000

n_episodes: 1


  # IMPORTANT:
  # Do NOT rewrite thermostat setpoint schedules to extreme values (10C/40C) when using
  # HVAC component actuators (fan/coil/availability). Those actuators typically cannot
  # create heating/cooling demand by themselves; EnergyPlus still uses the thermostat
  # setpoints to decide whether heating/cooling is needed.
  #
  # Keeping the building's original thermostat schedules allows the policy to control
  # conditioning by forcing the HVAC on/off via actuators while the thermostat provides
  # the demand signal.