# Configuration for baseline PPO on adaptive dynamics benchmark
# Same as parameterized_adaptive_dynamics but WITHOUT building parameter augmentation.
# The agent does not see building parameters — it must learn a single policy
# that works across all buildings without knowing which building it is in.
# Buildings are still resampled on each episode reset.

defaults:
  - _self_
  - wandb: default
  - training: default
  - policy: ppo_parameterized
  - reward: deadband

# Training overrides
training:
  # Number of parallel training environments.  Each env independently
  # resamples buildings, so PPO's rollout buffer contains diverse building
  # experiences before each policy update.
  num_train_envs: 4

# Environment configuration
env:
  normalize_obs: true
  # Disable building parameter augmentation — baseline agent has no building info
  augment_building_params: false
  # Pad raw observations to this fixed size so all buildings produce the same shape.
  # Buildings in action_space_2_zone_1 have variable zone counts (obs = N_zones + 7).
  # 20 accommodates up to 13 thermal zones; extra zero-padded dims are harmless.
  target_obs_size: 20
  control_mode: hvac_actuators
  max_steps: 35040  # One year at 15-min timesteps (365 * 24 * 4)

# Building selection - will be overridden by the trainer
# The trainer uses bldg.selection mechanism to sample from train/test splits
bldg:
  bldg: {}
  selection:
    enabled: false  # Will be enabled by trainer

# Random seed for reproducibility
seed: 42

# Hydra output directory configuration
hydra:
  run:
    dir: outputs/baseline_adaptive_dynamics/${policy.algorithm}/${now:%d-%m-%Y}/${now:%H-%M-%S}

