# Configuration for baseline PPO on adaptive dynamics benchmark
# Same as parameterized_adaptive_dynamics but WITHOUT building parameter augmentation.
# The agent does not see building parameters — it must learn a single policy
# that works across all buildings without knowing which building it is in.
# Buildings are still resampled on each episode reset.

defaults:
  - parameterized_adaptive_dynamics
  - _self_

# Override: Disable building parameter augmentation — baseline agent has no building info
env:
  augment_building_params: false

# Override: Use different output directory for baseline experiments
hydra:
  run:
    dir: ${oc.env:SCRATCH}/Building2Building/outputs/baseline_adaptive_dynamics/${policy.algorithm}/${now:%d-%m-%Y}/${now:%H-%M-%S}

