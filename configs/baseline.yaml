# Configuration for baseline evaluation using composition
defaults:
  - policies: constant
  - environment: default
  - _self_

# General parameters
seed: 1

# Hydra configuration for organized output directories
hydra:
  run:
    dir: results/baseline_${building_id}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: results/multirun/baseline_${now:%Y-%m-%d_%H-%M-%S}
    subdir: building_${building_id}
