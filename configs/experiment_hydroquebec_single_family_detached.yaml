defaults:
  - _self_

# Launcher config (controls how we enumerate buildings and spawn baseline runs).
experiment:
  # Virtualenv directory to activate before launching baselines. If null, we
  # auto-detect .venv/venv/.env under the repo root.
  venv: null

  # Root folder under which per-building Hydra output dirs are created.
  output_root: outputs/experiments/hydroquebec/single_family_detached

  # Sharding / resume controls.
  start: 0
  max_buildings: null

  skip_existing: true
  dry_run: false
  continue_on_error: true

  # Which baseline policy config to run for each building.
  policy: unitary_g36

  # Extra Hydra overrides forwarded to `python -m scripts.baselines`.
  # Example:
  #   - env.max_steps=96
  extra_overrides: []

hydra:
  # Keep the launcher outputs in a separate place from per-building run dirs.
  run:
    dir: outputs/experiments/_launcher/${now:%Y%m%d}/${now:%H%M%S}

