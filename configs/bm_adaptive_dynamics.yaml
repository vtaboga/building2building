defaults:
  - base
  - _self_
  - override /policy: unitary_sat

# The adaptive-dynamics benchmark evaluates a controller policy on a fixed dataset
# of Hydro-Québec buildings. It requires the actuator-based control mode.
env:
  normalize_obs: false
  control_mode: hvac_actuators

hydra:
  run:
    dir: outputs/benchmarks/adaptive_dynamics/${now:%Y%m%d}/${now:%H%M%S}
  job:
    chdir: true

