# W&B Sweep Configuration for PPO Bayesian Optimization
# This file defines the hyperparameter sweep for optimizing PPO performance

# Sweep configuration
program: scripts/train_ppo.py
method: bayes
metric:
  goal: maximize
  name: validation/episodic_return
early_terminate:
  type: hyperband
  min_iter: 100

# Number of runs to perform
count: 4

# Parameters to optimize
parameters:
  # W&B configuration (can be overridden by sweeps)
  project:
    value: "building2building"
  entity:
    value: null
  
  # PPO hyperparameters to tune
  ppo.learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2
  
  ppo.num_steps:
    values: [1024, 2048, 4096, 8192]
  
  ppo.num_minibatches:
    values: [16, 32, 64, 128]
  
  ppo.update_epochs:
    values: [4, 8, 10, 16]
  
  ppo.clip_coef:
    distribution: uniform
    min: 0.1
    max: 0.3
  
  ppo.ent_coef:
    distribution: uniform
    min: 0.0
    max: 0.1
  
  ppo.vf_coef:
    distribution: uniform
    min: 0.25
    max: 1.0
  
  ppo.max_grad_norm:
    distribution: uniform
    min: 0.3
    max: 1.0
  
  ppo.gae_lambda:
    distribution: uniform
    min: 0.8
    max: 0.99
  
  # Fixed parameters
  ppo.num_envs:
    value: 1
  
  ppo.anneal_lr:
    value: true
  
  ppo.gamma:
    value: 0.99
  
  ppo.norm_adv:
    value: true
  
  ppo.clip_vloss:
    value: true
  
  ppo.target_kl:
    value: null
  
  ppo.eval_frequency:
    value: 100
  
  # Training parameters
  training.total_timesteps:
    value: 1000
  
  training.save_model:
    value: true
  
  # Fixed seed
  seed:
    value: 1
  
  # W&B configuration
  track:
    value: true
  
  tags:
    value: ["sweep", "ppo", "optimization"]
  
  # Environment parameters (fixed)
  state:
    value: "VT"
  county:
    value: "Orleans"
  building_id:
    value: "1003000512784"
  weather:
    value: "USA_VT_Middlebury.State.AP.721028_TMYx.epw"
  weather_validation:
    value: "USA_VT_Bennington-Morse.State.AP.726166_TMYx.2004-2018.epw"
  reward_type:
    value: "base"
  energy_weight:
    value: 1.0 