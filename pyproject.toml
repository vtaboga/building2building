
[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b"
version = "0.1.0"
description = "A framework for energyplus building simulation for RL."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "minergym @ git+https://github.com/Terramorpha/minergym.git@actuators",
    "numpy>=1.24.0",
    "pandas==2.2.3",
    "geopandas==1.0.1",
    "shapely==2.0.5",
    "rdflib==7.1.4",
    "requests==2.32.3",
    "pytest==8.3.5",
    "duckdb==1.3.1",
    "pyarrow>=20.0.0",
    "rich>=14.1.0",
    "gitpython>=3.1.45",
    "bs4",
    "lxml>=6.0.2",
    "wandb>=0.22.3",
    "hydra-core>=1.3.2",
    "stable-baselines3>=2.7.0",
    "sb3-contrib>=2.7.0",
    "tensorboard>=2.20.0",
    "cattrs>=25.3.0",
]

[project.optional-dependencies]
test = [
    "deepdiff",
    "pytest",
    "pytest-mock",
]
dev = [
    "pyright",
    "nodeenv",
    # ... your dev dependencies
]

all = ["b2b[test,dev]"]


[tool.setuptools.packages.find]
where = ["."]
include = ["b2b*"]
exclude = ["tests*"]
