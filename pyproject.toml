[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "building2building"
version = "0.1.0"
description = "A framework for energyplus building simulation for RL."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "minergym @ git+https://github.com/Terramorpha/minergym",
    "numpy>=1.24.0",
    "pandas==2.2.3",
    "geopandas==1.0.1",
    "shapely==2.0.5",
    "matplotlib==3.10.1",
    "gymnasium==1.1.1",
    "rdflib==7.1.4",
    "requests==2.32.3",
    "jupyter==1.1.1",
    "pytest==8.3.5",
    "aiohttp==3.11.16",
    "torch==2.7.0",
    "wandb==0.19.10",
    "tyro==0.9.19",
    "tensorboard==2.19.0",
    "hydra-core==1.3.2",
    "duckdb==1.3.1",
    "bs4",
    "pyarrow>=20.0.0",
    "typing-extensions>=4.12.0",
    "rich>=14.1.0",
    "gitpython>=3.1.45",
]

[project.optional-dependencies]
test = [
    "deepdiff",
    "pytest",
    "pytest-mock",
]
dev = [
    "pyright",
    "nodeenv",
    # ... your dev dependencies
]

all = ["building2building[test,dev]"]


[tool.setuptools.packages.find]
where = ["."]
include = ["building2building*"]
exclude = ["tests*"]
