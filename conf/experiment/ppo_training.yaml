# @package _global_  
name: ppo_training

# PPO Training specific settings
training:
  algorithm: ppo
  total_timesteps: 1000000
  save_model: true
  
ppo:
  learning_rate: 3e-4
  num_envs: 1
  num_steps: 2048
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 32
  update_epochs: 10
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
  eval_frequency: 100000

# Environment settings
env:
  reward_type: "base"
  energy_weight: 1.0 